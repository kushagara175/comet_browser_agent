<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivaPilot — Microphone Permission</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0c10;
      color: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .permission-card {
      background: #15171e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .mic-bubble {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(138, 180, 248, 0.12);
      border: 1px solid rgba(138, 180, 248, 0.25);
      color: #8ab4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13.5px;
      color: #9aa0a6;
      line-height: 1.55;
      margin: 0 0 28px;
    }
    .btn-allow {
      background: #8ab4f8;
      color: #131314;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-allow:hover {
      background: #a8c7fa;
      transform: translateY(-1px);
    }
    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      min-height: 20px;
      color: #8ab4f8;
    }
    .status-msg.error {
      color: #f87171;
    }
    .status-msg.success {
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="permission-card">
    <div class="mic-bubble">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </div>
    <h1>Enable Microphone for PrivaPilot</h1>
    <p>Chrome requires granting microphone permission in a standard browser tab. Click below and select <strong>Allow</strong> in the browser prompt.</p>
    <button type="button" id="allowMicBtn" class="btn-allow">
      <span>Allow Microphone</span>
    </button>
    <div id="statusMsg" class="status-msg"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
