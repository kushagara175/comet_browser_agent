<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comet — Product Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070d;
      --card-bg: rgba(13, 17, 26, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.25);
      --text: #f1f5f9;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Subtle Background Glow */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(56, 189, 248, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(80px);
      z-index: 0;
      transition: opacity 0.5s ease;
    }

    /* Top Sleek Brand Tag */
    .brand-tag {
      position: absolute;
      top: 24px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      z-index: 10;
      user-select: none;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 10px #6366f1;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Top Right Action Controls */
    .top-actions {
      position: absolute;
      top: 20px;
      right: 32px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Main Showcase Canvas */
    .showcase-container {
      position: relative;
      width: 90vw;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px -10px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(20px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .showcase-container:hover {
      border-color: var(--border-glow);
    }

    /* Video Player */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      background: #000;
      display: block;
    }

    /* Drop Zone / Empty State Placeholder */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 24px;
      transition: background 0.2s ease;
      background: rgba(8, 12, 20, 0.6);
    }

    .empty-state.drag-over {
      background: rgba(99, 102, 241, 0.12);
      border: 2px dashed #6366f1;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--text-muted);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .empty-state:hover .empty-icon {
      transform: scale(1.08);
      color: var(--text);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .empty-hint {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.5;
    }

    .empty-hint span {
      color: #818cf8;
      font-weight: 500;
    }

    /* Hidden file input */
    #videoFileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ambient Light -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- Brand Minimal Tag -->
  <div class="brand-tag">
    <div class="brand-dot"></div>
    <span>Comet</span>
  </div>

  <!-- Top Right Actions -->
  <div class="top-actions">
    <button class="icon-btn" id="fsBtn" title="Fullscreen (F)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
    </button>
    <button class="icon-btn" id="glowToggleBtn" title="Toggle Ambient Glow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <!-- Main Pure Showcase Container -->
  <div class="showcase-container" id="showcaseContainer">
    <video id="player" controls playsinline loop preload="auto">
      <source src="videos/comet-demo.mp4" type="video/mp4">
      <source src="videos/comet-demo.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>

    <!-- Empty State / Drag & Drop Layer (hidden once video plays) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <p class="empty-hint">
        Click to select or drop a <span>video file</span> here<br/>
        or place <span>comet-demo.mp4</span> in <code>portfolio/videos/</code>
      </p>
    </div>
  </div>

  <input type="file" id="videoFileInput" accept="video/mp4,video/webm,video/quicktime" />

  <script>
    const player = document.getElementById('player');
    const emptyState = document.getElementById('emptyState');
    const showcaseContainer = document.getElementById('showcaseContainer');
    const videoFileInput = document.getElementById('videoFileInput');
    const fsBtn = document.getElementById('fsBtn');
    const glowToggleBtn = document.getElementById('glowToggleBtn');
    const ambientGlow = document.getElementById('ambientGlow');

    // Auto-hide empty state if comet-demo.mp4 successfully loaded
    player.addEventListener('loadeddata', () => {
      if (player.duration > 0) {
        emptyState.style.display = 'none';
      }
    });

    player.addEventListener('play', () => {
      emptyState.style.display = 'none';
    });

    // Click to pick video file
    emptyState.addEventListener('click', () => {
      videoFileInput.click();
    });

    videoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        loadVideoFile(file);
      }
    });

    // Drag and drop video file directly onto the dark pane
    ['dragenter', 'dragover'].forEach(eventName => {
      showcaseContainer.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyState.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      showcaseContainer.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyState.classList.remove('drag-over');
      });
    });

    showcaseContainer.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const file = dt.files[0];
      if (file && file.type.startsWith('video/')) {
        loadVideoFile(file);
      }
    });

    function loadVideoFile(file) {
      const url = URL.createObjectURL(file);
      player.src = url;
      player.load();
      player.play().catch(() => {});
      emptyState.style.display = 'none';
    }

    // Fullscreen toggle
    fsBtn.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        showcaseContainer.requestFullscreen().catch(() => {
          player.requestFullscreen().catch(() => {});
        });
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Toggle ambient glow
    glowToggleBtn.addEventListener('click', () => {
      ambientGlow.style.opacity = ambientGlow.style.opacity === '0' ? '1' : '0';
    });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        player.paused ? player.play() : player.pause();
      } else if (e.code === 'KeyF') {
        toggleFullscreen();
      } else if (e.code === 'KeyM') {
        player.muted = !player.muted;
      }
    });
  </script>
</body>
</html>
